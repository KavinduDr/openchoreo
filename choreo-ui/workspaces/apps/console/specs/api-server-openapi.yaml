      description: WorkloadSpec CRD schema
      type: object
      required: [owner]
      properties:
        owner:
          $ref: '#/components/schemas/WorkloadOwner'
        containers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Container'
          description: Container specifications keyed by container name
        endpoints:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WorkloadEndpoint'
          description: Network endpoints keyed by endpoint name
        connections:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WorkloadConnection'
          description: Resource connections keyed by connection name
    WorkloadOwner:
      type: object
      required: [projectName, componentName]
      properties:
        projectName: { type: string }
        componentName: { type: string }
    Container:
      type: object
      required: [image]
      properties:
        image: { type: string }
        command:
          type: array
          items: { type: string }
        args:
          type: array
          items: { type: string }
        env:
          type: array
          items:
            $ref: '#/components/schemas/EnvVar'
    EnvVar:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
    WorkloadEndpoint:
      type: object
      required: [type, port]
      properties:
        type:
          type: string
          enum: [HTTP, REST, gRPC, GraphQL, Websocket, TCP, UDP]
        port:
          type: integer
          minimum: 1
          maximum: 65535
        schema:
          $ref: '#/components/schemas/Schema'
    Schema:
      type: object
      properties:
        type: { type: string }
        content: { type: string }
    WorkloadConnection:
      type: object
      required: [type, inject]
      properties:
        type:
          type: string
          enum: [api]
        params:
          type: object
          additionalProperties: { type: string }
        inject:
          $ref: '#/components/schemas/WorkloadConnectionInject'
    WorkloadConnectionInject:
      type: object
      required: [env]
      properties:
        env:
          type: array
          items:
            $ref: '#/components/schemas/WorkloadConnectionEnvVar'
    WorkloadConnectionEnvVar:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }
    ApplyResourceResponse:
      type: object
      properties:
        apiVersion: { type: string }
        kind: { type: string }
        name: { type: string }
        namespace: { type: string }
        operation:
          type: string
          enum: [created, updated, unchanged]
    DeleteResourceResponse:
      type: object
      properties:
        apiVersion: { type: string }
        kind: { type: string }
        name: { type: string }
        namespace: { type: string }
        operation:
          type: string
          enum: [deleted, not_found]