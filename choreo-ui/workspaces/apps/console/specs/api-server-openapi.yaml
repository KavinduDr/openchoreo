openapi: 3.0.3
info:
  title: OpenChoreo API
  version: 1.0.0
  description: HTTP API for managing organizations, projects, components, environments, dataplanes, builds, and workloads in OpenChoreo.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /ready:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema:
                type: string
                example: Ready
  /api/v1/apply:
    post:
      summary: Apply a resource (server-side apply)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Resource applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseApply'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/delete:
    delete:
      summary: Delete a resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Resource deletion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseDelete'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/get/{kind}:
    get:
      summary: List resources by kind
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
          description: Resource kind (organization, project, component, etc.)
        - name: orgName
          in: query
          schema:
            type: string
          description: Organization name (required for namespaced resources)
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseAny'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/get/{kind}/{name}:
    get:
      summary: Get resource by kind and name
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
          description: Resource kind (organization, project, component, etc.)
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Resource name
        - name: orgName
          in: query
          schema:
            type: string
          description: Organization name (required for namespaced resources)
      responses:
        '200':
          description: Resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseAny'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs:
    get:
      summary: List organizations
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListOrganization'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}:
    get:
      summary: Get organization
      parameters:
        - $ref: '#/components/parameters/orgName'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseOrganization'
        '404':
          $ref: '#/components/responses/NotFoundOrganization'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/dataplanes:
    get:
      summary: List dataplanes
      parameters:
        - $ref: '#/components/parameters/orgName'
      responses:
        '200':
          description: List of dataplanes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListDataPlane'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create dataplane
      parameters:
        - $ref: '#/components/parameters/orgName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataPlaneRequest'
      responses:
        '201':
          description: Created dataplane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseDataPlane'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ConflictDataPlaneExists'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/dataplanes/{dpName}:
    get:
      summary: Get dataplane
      parameters:
        - $ref: '#/components/parameters/orgName'
        - name: dpName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dataplane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseDataPlane'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundDataPlane'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/environments:
    get:
      summary: List environments
      parameters:
        - $ref: '#/components/parameters/orgName'
      responses:
        '200':
          description: List of environments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListEnvironment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create environment
      parameters:
        - $ref: '#/components/parameters/orgName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Created environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvironment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ConflictEnvironmentExists'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/environments/{envName}:
    get:
      summary: Get environment
      parameters:
        - $ref: '#/components/parameters/orgName'
        - name: envName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseEnvironment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/buildplanes:
    get:
      summary: List build planes
      parameters:
        - $ref: '#/components/parameters/orgName'
      responses:
        '200':
          description: Build planes (returns single or empty for org)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseBuildPlane'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/build-templates:
    get:
      summary: List build templates
      parameters:
        - $ref: '#/components/parameters/orgName'
      responses:
        '200':
          description: List of build templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListBuildTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects:
    get:
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/orgName'
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create project
      parameters:
        - $ref: '#/components/parameters/orgName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/ConflictProjectExists'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}:
    get:
      summary: Get project
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseProject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundProject'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/deployment-pipeline:
    get:
      summary: Get deployment pipeline for project
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
      responses:
        '200':
          description: Deployment pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseDeploymentPipeline'
        '404':
          $ref: '#/components/responses/NotFoundDeploymentPipeline'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components:
    get:
      summary: List components
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
      responses:
        '200':
          description: List of components
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListComponent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundProject'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create component
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComponentRequest'
      responses:
        '201':
          description: Created component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseComponent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundProject'
        '409':
          $ref: '#/components/responses/ConflictComponentExists'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components/{componentName}:
    get:
      summary: Get component
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
        - name: include
          in: query
          description: Comma-separated additional resources to include
          schema:
            type: string
      responses:
        '200':
          description: Component
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseComponent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundComponentOrProject'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components/{componentName}/bindings:
    get:
      summary: Get component bindings
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
        - name: environment
          in: query
          description: Optional environment filters (repeatable)
          schema:
            type: array
            items:
              type: string
            style: form
            explode: true
      responses:
        '200':
          description: List of bindings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundComponentOrProject'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components/{componentName}/bindings/{bindingName}:
    patch:
      summary: Update component binding
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
        - name: bindingName
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBindingRequest'
      responses:
        '200':
          description: Updated binding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundBindingOrComponentOrProject'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components/{componentName}/promote:
    post:
      summary: Promote component to next environment
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteComponentRequest'
      responses:
        '200':
          description: Created bindings for target environment(s)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListBinding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFoundPromotionPrereq'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components/{componentName}/builds:
    post:
      summary: Trigger build
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
        - name: commit
          in: query
          schema:
            type: string
      responses:
        '201':
          description: Build triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseBuild'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: List builds
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
      responses:
        '200':
          description: List of builds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseListBuild'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components/{componentName}/environments/{environmentName}/observer-url:
    get:
      summary: Get runtime observer URL for component
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
        - name: environmentName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Observer URL info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseComponentObserver'
        '404':
          $ref: '#/components/responses/NotFoundObserverPrereq'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components/{componentName}/observer-url:
    get:
      summary: Get build observer URL for component
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
      responses:
        '200':
          description: Observer URL info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseComponentObserver'
        '404':
          $ref: '#/components/responses/NotFoundComponentOrProject'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/orgs/{orgName}/projects/{projectName}/components/{componentName}/workloads:
    get:
      summary: Get workloads for component
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
      responses:
        '200':
          description: Workloads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseAny'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create or update workload for component
      parameters:
        - $ref: '#/components/parameters/orgName'
        - $ref: '#/components/parameters/projectName'
        - $ref: '#/components/parameters/componentName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkloadSpec'
      responses:
        '201':
          description: Created workload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseAny'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    orgName:
      name: orgName
      in: path
      required: true
      schema:
        type: string
    projectName:
      name: projectName
      in: path
      required: true
      schema:
        type: string
    componentName:
      name: componentName
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    NotFoundOrganization:
      description: Organization not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    NotFoundProject:
      description: Project not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    NotFoundComponentOrProject:
      description: Component or project not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    NotFoundBindingOrComponentOrProject:
      description: Binding, component or project not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    NotFoundDataPlane:
      description: DataPlane not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    NotFoundDeploymentPipeline:
      description: Deployment pipeline not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    NotFoundObserverPrereq:
      description: Component/environment/dataplane not found or observer not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    ConflictProjectExists:
      description: Project already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    ConflictComponentExists:
      description: Component already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    ConflictEnvironmentExists:
      description: Environment already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
    ConflictDataPlaneExists:
      description: DataPlane already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIResponseError'
  schemas:
    APIResponseBase:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
        error:
          type: string
    APIResponseError:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: false
        error:
          example: some error message
        code:
          example: INTERNAL_ERROR
    APIResponseAny:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          description: Arbitrary JSON payload
          nullable: true
    APIResponseListOrganization:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/ListOrganization'
    APIResponseOrganization:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/Organization'
    APIResponseListProject:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/ListProject'
    APIResponseProject:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/Project'
    APIResponseListComponent:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/ListComponent'
    APIResponseComponent:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/Component'
    APIResponseListBinding:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/ListBinding'
    APIResponseBinding:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/Binding'
    APIResponseListEnvironment:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/ListEnvironment'
    APIResponseEnvironment:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/Environment'
    APIResponseListDataPlane:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/ListDataPlane'
    APIResponseDataPlane:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/DataPlane'
    APIResponseDeploymentPipeline:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/DeploymentPipeline'
    APIResponseListBuild:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/ListBuild'
    APIResponseBuild:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/Build'
    APIResponseComponentObserver:
      allOf:
        - $ref: '#/components/schemas/APIResponseBase'
      properties:
        success:
          example: true
        data:
          $ref: '#/components/schemas/ComponentObserver'
